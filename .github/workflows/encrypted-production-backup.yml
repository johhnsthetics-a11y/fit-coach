name: Encrypted production backup

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ vars.PRODUCTION_BACKUPS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate private backup configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_ENCRYPTION_PASSWORD R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
          done
      - name: Install runtime dependencies
        run: pnpm install --frozen-lockfile --prod
      - name: Export database and private Storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/database backup/storage
          pnpm dlx supabase@2.120.0 db dump --db-url "$SUPABASE_DB_URL" -f backup/database/roles.sql --role-only
          pnpm dlx supabase@2.120.0 db dump --db-url "$SUPABASE_DB_URL" -f backup/database/schema.sql
          pnpm dlx supabase@2.120.0 db dump --db-url "$SUPABASE_DB_URL" -f backup/database/data.sql --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes
          node scripts/supabase-storage-backup.mjs backup/storage
      - name: Encrypt backup before upload
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive="coach-fit-pro-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}.tar.gz.enc"
          tar -C backup -czf - . | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:BACKUP_ENCRYPTION_PASSWORD -out "$archive"
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload encrypted archive to private R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "${{ steps.archive.outputs.archive }}" "s3://${R2_BUCKET}/database/${{ steps.archive.outputs.archive }}" --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp "${{ steps.archive.outputs.archive }}.sha256" "s3://${R2_BUCKET}/database/${{ steps.archive.outputs.archive }}.sha256" --endpoint-url "$endpoint" --only-show-errors
