<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var storedTheme = window.localStorage.getItem('coachfitpro-ui-theme-20260831') || 'light'
        if (storedTheme !== 'dark' && storedTheme !== 'light') storedTheme = 'light'
        document.documentElement.dataset.theme = storedTheme
        document.documentElement.style.colorScheme = storedTheme
      } catch (_) {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.style.colorScheme = 'light'
      }
    </script>
    <meta name="description" content="Coach Fit Pro - gestão profissional para treinadores e alunos." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Coach Fit Pro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/fit-coach-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logoabre.png" />
    <title>Coach Fit Pro</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ative o JavaScript para abrir o Coach Fit Pro.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
